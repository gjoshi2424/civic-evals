title: 'State Voting Rights: Felon Disenfranchisement Policies Across Five States'
description: |
  Five tasks with an identical scenario — felony conviction, currently on parole —
  posed for five states representing five distinct policy regimes: no
  disenfranchisement (Vermont), rights restored upon release (California),
  automatic restoration after full sentence discharge (Texas), waiting-period
  requirement (Wyoming), and mandatory application to the governor (Iowa).
  Scored entirely with rubric_judge to capture nuanced factual accuracy and
  calibrated uncertainty on state-specific law.
group: Civic Information Reliability
